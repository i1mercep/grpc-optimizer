name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libclang-dev protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python interoperability
        shell: bash
        run: |
          python -m pip install -r clients/python/requirements.txt
          mkdir -p clients/python/generated
          python -m grpc_tools.protoc -I proto --python_out=clients/python/generated --grpc_python_out=clients/python/generated proto/optimization/v1/optimizer.proto
          python -m unittest discover -s clients/python -p 'test_*.py'
          cargo build --locked --bin grpc-optimizer-server --bin grpc-optimizer-client
          OPT_CPU_BUDGET=2 OPT_STREAM_WINDOW=2 target/debug/grpc-optimizer-server > /tmp/grpc-optimizer-server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid"; wait "$server_pid"; cat /tmp/grpc-optimizer-server.log' EXIT
          python clients/python/smoke_test.py
