name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libclang-dev protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.3'
          enable-cache: true
      - name: Python setup and static checks
        run: |
          uv python install
          uv sync --locked
          uv run --locked python clients/python/generate_stubs.py
          git diff --exit-code -- clients/python/grpc_optimizer/_generated
          uv run --locked ruff format --check clients/python
          uv run --locked ruff check clients/python
          uv run --locked pyrefly check
          uv run --locked python -m unittest discover -s clients/python -p 'test_*.py'
          uv build
          uv venv /tmp/optimizer-sdk-check
          uv pip install --python /tmp/optimizer-sdk-check/bin/python dist/*.whl
          cd /tmp
          /tmp/optimizer-sdk-check/bin/python -c 'from grpc_optimizer import solve, solve_async, PyomoClient'
      - name: Python interoperability
        shell: bash
        run: |
          cargo build --locked --bin grpc-optimizer-server --bin grpc-optimizer-client
          OPT_CPU_BUDGET=2 OPT_STREAM_WINDOW=2 target/debug/grpc-optimizer-server > /tmp/grpc-optimizer-server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid"; wait "$server_pid"; cat /tmp/grpc-optimizer-server.log' EXIT
          uv run --locked python clients/python/smoke_test.py
