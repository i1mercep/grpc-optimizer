[project]
name = "grpc-optimizer-clients"
version = "0.1.0"
description = "Python and Pyomo clients for grpc-optimizer"
requires-python = ">=3.14,<3.15"
dependencies = ["grpcio==1.84.0", "protobuf==7.36.2", "pyomo==6.10.1"]

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
    "pyrefly",
    "ruff",
    "types-grpcio>=1.84.0.20261020",
    "types-protobuf",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
extend-exclude = ["clients/python/generated"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "RUF",
    "SIM",
    "TID",
    "SLOT",
]

[tool.ruff.lint.isort]
known-first-party = ["client", "optimization", "pyomo_adapter", "pyomo_client"]
known-third-party = ["google", "grpc", "pyomo"]

[tool.ruff.lint.per-file-ignores]
# Generated modules become importable after adding their directory to sys.path.
"clients/python/client.py" = ["E402"]
"clients/python/pyomo_adapter.py" = ["E402"]

[tool.pyrefly]
project-includes = ["clients/python/*.py"]
search-path = ["clients/python", "clients/python/generated"]
python-version = "3.14"
# Pyomo constructs component attributes dynamically and has no typing contract.
replace-untyped-imports-with-any = ["pyomo.*"]
