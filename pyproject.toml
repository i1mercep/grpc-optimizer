[project]
name = "grpc-optimizer-clients"
version = "0.1.0"
description = "Solve Pyomo linear models through grpc-optimizer"
requires-python = ">=3.14,<3.15"
dependencies = ["grpcio==1.84.0", "protobuf==7.36.2", "pyomo==6.10.1"]

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
    "pyrefly",
    "ruff",
    "types-grpcio>=1.84.0.20261020",
    "types-protobuf",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["clients/python"]
include = ["grpc_optimizer*"]

[tool.setuptools.package-data]
grpc_optimizer = ["py.typed", "_generated/**/*.pyi"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["clients/python/generated", "clients/python/grpc_optimizer/_generated"]
line-length = 120

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "RUF",
    "SIM",
    "TID",
    "SLOT",
]

[tool.ruff.lint.isort]
known-first-party = ["client", "grpc_optimizer", "pyomo_adapter", "pyomo_client"]
known-third-party = ["google", "grpc", "pyomo"]

[tool.pyrefly]
project-includes = ["clients/python/**/*.py"]
project-excludes = ["clients/python/generated/**", "clients/python/grpc_optimizer/_generated/**"]
search-path = ["clients/python"]
python-version = "3.14"
# Pyomo constructs component attributes dynamically and has no typing contract.
replace-untyped-imports-with-any = ["pyomo.*"]
