[package]
name = "grpc-optimizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[[bin]]
name = "grpc-optimizer-server"
path = "src/bin/server.rs"

[[bin]]
name = "grpc-optimizer-client"
path = "src/bin/client.rs"

[[bin]]
name = "grpc-optimizer-bench"
path = "src/bin/bench.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
highs = "2.4"
highs-sys = "=1.15.0"
http = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["tls-aws-lc", "tls-native-roots"] }
tonic-prost = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = "0.5"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
